buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${rootProject.ext.has('kotlinVersion') ? rootProject.ext.get('kotlinVersion') : '2.1.20'}"
  }
}

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

// Codegen (Props/EventEmitter C++, ViewManager interface/delegate) — New Architecture only.
apply plugin: "com.facebook.react"
apply plugin: "com.android.library"

// AGP 9 builds Kotlin itself unless the app opts out with `android.builtInKotlin=false`
// (same fallback as react-native-safe-area-context / react-native-screens).
def shouldApplyKotlinPlugin() {
  def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0].toInteger()
  if (agpMajor <= 8) return true
  def builtIn = providers.gradleProperty("android.builtInKotlin").orNull
  return builtIn != null && !builtIn.toBoolean()
}
if (shouldApplyKotlinPlugin()) {
  apply plugin: "kotlin-android"
}

android {
  namespace "com.turbohtml"
  compileSdkVersion safeExtGet("compileSdkVersion", 36)

  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    targetSdkVersion safeExtGet("targetSdkVersion", 36)
  }

  sourceSets {
    main {
      java.srcDirs += ["${project.buildDir}/generated/source/codegen/java"]
    }
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  implementation "com.facebook.react:react-android"
}
